<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#15161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natan">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icone/apple-touch-icon.png">
<link rel="icon" href="../icone/icon-192.png">
<title>Natan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15161c;--side:#0f1015;--raise:#1f2129;--raise2:#2a2d38;--hover:#252833;--line:#2c2f3b;
  --text:#ececf1;--soft:#c5c8d6;--muted:#8b8fa3;--acc:#7c83ff;--acc-h:#929aff;--vio:#a07bff;--blue:#4da3ff;
  --good:#3ecf8e;--bad:#f06464;--warn:#f5b84a;
  --sans:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--head:Sora,Figtree,-apple-system,sans-serif;
  --col:768px;--r:14px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:#aab0ff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
svg{flex:none}
/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.btn:hover{background:var(--acc-h)}
.btn.ghost{background:var(--raise);color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{background:var(--hover)}
.btn.red{background:var(--bad)}.btn:disabled{opacity:.45;cursor:default}
.ib{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft)}
.ib:hover{background:var(--hover);color:var(--text)}
.field{width:100%;min-height:46px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.field:focus{border-color:var(--acc)}
textarea.field{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--soft)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.err{color:#ff9393;font-size:14px;min-height:20px}
.small{font-size:13px;color:var(--muted)}
/* avvio */
#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:90;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.logo{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;animation:reveal 1.9s ease-in-out forwards}
.logo svg{position:absolute;inset:0;animation:orbit 2.4s linear infinite}
.logo b{font:800 100px/1 var(--head);color:#fff}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes reveal{0%{opacity:0;filter:blur(16px);transform:scale(.85)}30%{opacity:1;filter:blur(0);transform:scale(1)}75%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(22px);transform:scale(1.1)}}
.mark{width:28px;height:28px;border-radius:8px;background:#000;display:inline-flex;align-items:center;justify-content:center;font:800 15px/1 var(--head);color:#fff;border:1px solid #2c2f3b;flex:none}
/* primo avvio */
#onb{position:fixed;inset:0;overflow-y:auto;display:flex;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 18px 32px}
#onb .card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
#onb h1{font:700 30px/1.15 var(--head);margin:0;letter-spacing:-.4px}
#onb .lead{color:var(--soft);margin:0}
.steps{display:flex;gap:6px}.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}.steps i.on{background:var(--acc)}
.consent{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}.check input{width:20px;height:20px;accent-color:var(--acc);flex:none}
/* struttura */
#app{position:fixed;inset:0;display:flex}
#side{width:264px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 10px 10px;gap:2px;z-index:40;transition:transform .22s ease}
.side-top{display:flex;align-items:center;gap:10px;padding:4px 6px 12px}
.side-top b{font:700 19px/1 var(--head);flex:1}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;color:var(--soft);font-weight:500;font-size:15px;min-height:40px}
.sbtn:hover{background:var(--hover);color:var(--text)}.sbtn.on{background:var(--raise2);color:var(--text)}
.sbtn .badge{margin-left:auto;font-size:12px;font-weight:700;background:#1f3b2f;color:#8be3b8;border-radius:999px;padding:1px 8px}
.slabel{font-size:12px;color:var(--muted);padding:16px 10px 6px;font-weight:600}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px}
#chatList .sbtn{font-size:14px;padding:8px 10px;min-height:36px}
#chatList .sbtn span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.me{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.me small{display:block;color:var(--muted);font-size:12px}
#shade{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;min-height:56px}
#sideOpen{display:none}
#modelBtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font:600 17px/1 var(--head)}
#modelBtn:hover{background:var(--hover)}#modelBtn span{color:var(--muted);font-weight:600}
.menu{position:absolute;top:56px;left:12px;z-index:50;width:min(360px,calc(100vw - 24px));background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 48px rgba(0,0,0,.45)}
.mi{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:11px}
.mi:hover{background:var(--hover)}.mi.lock{opacity:.6}
.mi strong{display:block;font-weight:600}.mi small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.mi .tick{margin-left:auto;color:var(--acc);font-weight:700;visibility:hidden}.mi.on .tick{visibility:visible}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;background:#1f3b2f;color:#8be3b8;vertical-align:1px}
.tag.warn{background:#3d3018;color:#ffd27a}.tag.no{background:#3d1f24;color:#ff9ea2}
.menu .foot{font-size:12px;color:var(--muted);padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--raise);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status i.on{background:var(--good)}.status i.dev{background:var(--blue)}.status i.net{background:var(--vio)}.status i.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* chat */
#chatView{flex:1;min-height:0;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#thread{max-width:var(--col);margin:0 auto;padding:8px 20px 24px}
#chatView.empty #scroll{flex:none;margin-top:auto}
#chatView.empty #dock{margin-bottom:auto}
.hello{text-align:center;padding:0 0 22px}
.hello h2{font:600 28px/1.2 var(--head);margin:14px 0 0;letter-spacing:-.3px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.sugg button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--soft)}.sugg button:hover{background:var(--hover)}
.msg{margin:22px 0}
.msg.u{display:flex;justify-content:flex-end}
.msg.u>div{display:flex;flex-direction:column;align-items:flex-end;max-width:82%;min-width:0}
.msg.u .bub{background:var(--raise2);border-radius:20px;padding:10px 16px;max-width:100%;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.th{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}.th img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.msg.a{display:flex;gap:14px}
.msg.a .mark{margin-top:2px}
.msg.a .body{flex:1;min-width:0}
.msg.a .txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.65;color:#e4e5ec}
.msg.a .txt.wait{color:var(--muted)}
.acts{display:flex;align-items:center;gap:2px;margin-top:8px;flex-wrap:wrap;color:var(--muted)}
.acts .ib{width:32px;height:32px}.acts .ib.up{color:var(--good)}.acts .ib.dn{color:var(--bad)}
.acts .tb{font-size:13px;padding:6px 10px;border-radius:9px;color:var(--soft)}.acts .tb:hover{background:var(--hover)}
.acts .meta{margin-left:auto;font-size:12px}
.why{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#dock{max-width:var(--col);width:100%;margin:0 auto;padding:0 12px max(8px,calc(env(safe-area-inset-bottom) - 14px))}
#notice{font-size:13px;color:var(--soft);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:4px;background:var(--raise2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
#pics{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;align-items:center}
#pics img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
.composer{background:var(--raise);border:1px solid var(--line);border-radius:24px;padding:10px 10px 8px 16px;display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:#3d4152}
#inp{resize:none;background:transparent;border:0;outline:none;min-height:28px;max-height:200px;padding:4px 0;line-height:1.5}
.cbar{display:flex;align-items:center;gap:4px;margin-left:-8px}
.tg{font-size:13px;font-weight:600;border-radius:999px;padding:6px 11px;color:var(--muted);border:1px solid transparent}
.tg:hover{background:var(--hover)}.tg.on{color:var(--soft);border-color:var(--line)}
#send{width:36px;height:36px;border-radius:50%;background:var(--text);color:#15161c;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
#send:disabled{opacity:.3;cursor:default}
#mic.rec{background:var(--bad);color:#fff}
.fine{text-align:center;font-size:11px;color:var(--muted);margin:5px 0 0}
@media (max-width:899px){.fine{display:none}}
/* menu della chat: fissa, rinomina, elimina */
#chatList .crow{display:flex;align-items:center;border-radius:10px}
#chatList .crow:hover,#chatList .crow.on{background:var(--hover)}#chatList .crow.on{background:var(--raise2)}
#chatList .crow .sbtn{flex:1;min-width:0;background:none}
#chatList .crow .more{width:30px;height:30px;flex:none;border-radius:8px;color:var(--muted);opacity:.0}
#chatList .crow:hover .more,#chatList .crow.on .more,#chatList .crow .more:focus{opacity:1}
@media (hover:none){#chatList .crow .more{opacity:1}}
.pin{font-size:11px;color:var(--muted);margin-right:2px}
.cmenu{position:fixed;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:5px;min-width:170px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.cmenu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px}.cmenu button:hover{background:var(--hover)}
.cmenu button.red{color:#ff8a8a}
/* pagine */
#pageView{flex:1;min-height:0;overflow-y:auto}
.page{max-width:900px;margin:0 auto;padding:8px 20px 40px;display:flex;flex-direction:column;gap:16px}
.page h1{font:700 26px/1.2 var(--head);margin:4px 0 0;letter-spacing:-.3px}
.page .lead{color:var(--soft);margin:0;max-width:640px}
.panel{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font:600 17px/1.3 var(--head);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px}.stat b{display:block;font:700 28px/1.1 var(--head)}.stat span{font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--soft)}.log time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.hw{display:flex;flex-direction:column;gap:6px;font-size:14px}.hw div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hw b{min-width:120px;color:var(--muted);font-weight:500}
.sw{position:relative;width:52px;height:30px;border-radius:999px;background:var(--raise2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--good)}.sw.on::after{transform:translateX(22px)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--raise2);color:var(--soft)}
.pill.ok{background:#1f3b2f;color:#8be3b8}.pill.wait{background:#3d3018;color:#ffd27a}.pill.no{background:#3d1f24;color:#ff9ea2}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column}.li input{width:20px;height:20px;accent-color:var(--acc)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--acc)}
.imp{display:flex;gap:12px;min-height:360px;height:calc(100vh - 380px)}
.imp .col{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;font-size:14px}
.imp .c1{width:200px;flex:none}.imp .c2{width:240px;flex:none}
.imp .c3{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.imp .col button{text-align:left;padding:8px 10px;border-radius:9px;color:var(--soft)}.imp .col button:hover{background:var(--hover)}
.imp .col button.on{background:var(--raise2);color:var(--text);font-weight:600}
.imp .col strong{color:var(--acc);padding:8px 10px 2px;font-size:13px}
.imp .c3 p{margin:0;line-height:1.65;color:var(--soft);white-space:pre-wrap}
.live{font-size:14px;color:#9fd3ff}
/* chiamata */
#call{position:fixed;inset:0;z-index:97;background:radial-gradient(circle at 50% 40%,#191b26 0,#0b0c11 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#orb{width:min(70vw,340px);height:min(70vw,340px)}
#callState{font:600 20px/1.3 var(--head);text-align:center;min-height:26px}
#callSub{color:var(--muted);text-align:center;max-width:520px;min-height:44px;font-size:15px}
.cbtns{display:flex;gap:16px}
.cbtns .ib{width:60px;height:60px;border-radius:50%;background:var(--raise2);color:var(--text)}
.cbtns .end{background:var(--bad);color:#fff}
.cbtns .ib.off{background:#fff;color:#111}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--raise2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:95;transition:opacity .3s;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* telefono e finestre strette */
@media (max-width:899px){
  #side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);width:min(84vw,300px)}
  #app.open #side{transform:none}
  #app.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  #sideOpen{display:inline-flex}
  #sideClose{display:inline-flex}
  .status span{display:none}.status{padding:8px}
  #thread{padding:8px 16px 20px}
  .imp{flex-direction:column;height:auto}.imp .c1,.imp .c2{width:auto;max-height:200px}
}
@media (min-width:900px){#sideClose{display:none}#app.closed #side{display:none}#app.closed #sideOpen{display:inline-flex}}
@media (prefers-reduced-motion:reduce){.logo,.logo svg{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="splash">
  <div class="logo" aria-label="Natan">
    <svg viewBox="0 0 220 220" aria-hidden="true">
      <circle cx="110" cy="110" r="92" fill="none" stroke="#1d2030" stroke-width="2"/>
      <path d="M52 40 A92 92 0 0 1 182 55" fill="none" stroke="#a07bff" stroke-width="4" stroke-linecap="round"/>
      <path d="M182 55 l-13 -3 m13 3 l-4 13" stroke="#a07bff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M197 137 A92 92 0 0 1 102 201" fill="none" stroke="#7c83ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M102 201 l12 -5 m-12 5 l9 10" stroke="#7c83ff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M26 144 A92 92 0 0 1 22 94" fill="none" stroke="#8f96ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M22 94 l-5 11 m5 -11 l8 9" stroke="#8f96ff" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
    <b>N</b>
  </div>
</div>

<div id="onb" class="hide"><div class="card" id="onbCard"></div></div>

<div id="app" class="hide">
  <aside id="side" aria-label="Menu">
    <div class="side-top"><span class="mark">N</span><b>Natan</b>
      <button class="ib" id="sideClose" aria-label="Chiudi il menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
    <button class="sbtn" id="newChat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Nuova chat</button>
    <button class="sbtn" data-p="impara"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h13"/></svg>Impara</button>
    <button class="sbtn" data-p="aiuta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8Z"/></svg>Aiuta Natan<span class="badge hide" id="helpBadge"></span></button>
    <div class="slabel">Chat</div>
    <div id="chatList"></div>
    <button class="sbtn me" data-p="impostazioni"><span class="av" id="meAv">?</span><span><span id="meName"></span><small>Impostazioni</small></span></button>
  </aside>
  <div id="shade"></div>
  <section id="main">
    <header id="top">
      <button class="ib" id="sideOpen" aria-label="Apri il menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>

async function findBase(force){

}
async function api(path,body,retry=true){
  if(!BASE)await findBase();
  if(!BASE)throw Object.assign(new Error("offline"),{code:0});
  let r;
  try{r=await fetch(BASE+path,{method:body?"POST":"GET",headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})}
  catch(e){if(retry){await findBase(true);if(!await quickOk()&&await tryLocal()){}return api(path,body,false)}throw Object.assign(new Error("offline"),{code:0})}
  if(r.status===502||r.status===530||r.status===1033){if(retry&&BASE!==LOCAL&&await tryLocal())return api(path,body,false);throw Object.assign(new Error("offline"),{code:0})}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const er=new Error(d.error||("errore "+r.status));er.code=r.status;er.data=d;throw er}
  return d
}

const ENG={e:null,id:"",lvl:"",loading:null,queue:Promise.resolve(),prog:null};

async function gpuInfo(){
  if(GPU)return GPU;
  if(window.NATAN_FAKE){GPU=window.NATAN_FAKE.gpu||{ok:true,f16:true,vendor:"nvidia",arch:"ampere",desc:"",maxBuf:4e9};return GPU}
  if(!navigator.gpu)return GPU={ok:false};
  try{const a=await navigator.gpu.requestAdapter({powerPreference:"high-performance"});if(!a)return GPU={ok:false};
    let info=a.info||{};if(!info.vendor&&a.requestAdapterInfo){try{info=await a.requestAdapterInfo()}catch(e){}}
    GPU={ok:true,f16:a.features.has("shader-f16"),vendor:(info.vendor||"").toLowerCase(),arch:(info.architecture||"").toLowerCase(),desc:info.description||"",maxBuf:a.limits.maxBufferSize||0}}
  catch(e){GPU={ok:false}}
  return GPU
}
async function pickId(lvl,wl){

  if(/<think>/.test(t)){if(!final)return "Ci penso un attimo…";t=t.replace(/<think>[\s\S]*/,"")}

}
async function gen(lvl,messages,{maxTokens=900,think=false,onText}={}){

const DB={_db:null,
  open(){if(this._db)return Promise.resolve(this._db);return new Promise((ok,bad)=>{const r=indexedDB.open("natan",1);r.onupgradeneeded=()=>r.result.createObjectStore("lib");r.onsuccess=()=>{this._db=r.result;ok(r.result)};r.onerror=()=>bad(r.error)})},
  async run(mode,fn){const d=await this.open();return new Promise((ok,bad)=>{const tx=d.transaction("lib",mode);const rq=fn(tx.objectStore("lib"));tx.oncomplete=()=>ok(rq&&rq.result);tx.onerror=()=>bad(tx.error)})},
  get(k){return this.run("readonly",s=>s.get(k))},set(k,v){return this.run("readwrite",s=>s.put(v,k))},del(k){return this.run("readwrite",s=>s.delete(k))}
};

const STOP=new Set("che chi cosa come dove quando perche quale quali quanto quanti sono sei era erano essere avere del della dello dei degli delle dal dalla dai dagli nel nella nei negli nelle sul sulla sui sugli sulle con per tra fra una uno gli le lo la il mi ti ci si vi me te noi voi loro suo sua tuo tua mio mia questo questa questi quello quella fammi dimmi spiegami spiega scrivi fai puoi vorrei voglio sapere anche ancora molto poco piu meno tutto tutti tutte the and for with what how".split(" "));
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
async function loadMem(){
  if(MEM)return MEM;const out=[];
  for(const m of Object.keys(libMeta())){let rows=[];try{rows=(await DB.get("m:"+m))||[]}catch(e){}for(const r of rows)out.push({m,t:r[2],x:r[3],k:norm(r[2]+" "+r[3]),tk:norm(r[2])})}
  MEM=out;return MEM
}
async function searchLib(query,k=3){
  const terms=[...new Set(norm(query).match(/[a-z0-9]{3,}/g)||[])].filter(t=>!STOP.has(t)).slice(0,10).map(t=>t.length>6?t.slice(0,6):t);
  if(!terms.length)return [];
  const mem=await loadMem();if(!mem.length)return [];
  const df=terms.map(()=>0),hits=[];
  for(const n of mem){let any=false;const c=terms.map(t=>{if(n.k.indexOf(t)<0)return 0;any=true;return 1});if(any){hits.push({n,c});c.forEach((v,i)=>df[i]+=v)}}
  const N=mem.length,idf=df.map(d=>Math.log(1+N/(1+d)));
  for(const h of hits){let s=0;terms.forEach((t,i)=>{if(h.c[i])s+=idf[i]*(h.n.tk.includes(t)?3:1)});h.s=s}
  hits.sort((a,b)=>b.s-a.s);
  return hits.slice(0,k).filter(h=>h.s>0).map(h=>h.n)
}
async function wiki(params){

}
async function wikiContext(query){
  if(!navigator.onLine||!$("tNet").classList.contains("on"))return [];
  try{
    const s=await wiki({action:"query",list:"search",srlimit:2,srsearch:query.slice(0,200)});
    const ids=((s.query&&s.query.search)||[]).map(x=>x.pageid);if(!ids.length)return [];
    const e=await wiki({action:"query",prop:"extracts",exintro:1,explaintext:1,exchars:1200,pageids:ids.join("|")});
    return Object.values((e.query&&e.query.pages)||{}).map(p=>({t:p.title,x:p.extract||""})).filter(p=>p.x)
  }catch(e){return []}
}
async function downloadLib(list,onp){
  const idx=await (await fetch("../biblioteca/indice.json?t="+Date.now(),{cache:"no-store"})).json();
  const meta=libMeta();let done=0;
  for(const name of list){

    let rows=[];
    for(const f of it.files){onp&&onp(name,done,list.length);const d=await (await fetch("../biblioteca/"+f+"?v="+it.max)).json();rows=rows.concat(d.n)}
    await DB.set("m:"+name,rows);meta[name]={n:rows.length,max:it.max,kb:it.kb};done++
  }
  setLibMeta(meta);return idx
}

// RETE DEI VOLONTARI SENZA IL MAC: i telefoni si collegano direttamente ai PC dei volontari (WebRTC, cifrato).
// Ogni volontario ha un certificato firmato dal server di Natan (dura 4 giorni) e una sua chiave: niente impostori.
const PEERJS=["https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js","https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"];
let PEERLIB=null;
async function peerLib(){
  if(window.NATAN_FAKE_PEER)return window.NATAN_FAKE_PEER;
  if(PEERLIB)return PEERLIB;
  for(const u of PEERJS){try{await new Promise((ok,bad)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=bad;document.head.append(s)});if(window.Peer){PEERLIB=window.Peer;return PEERLIB}}catch(e){}}
  throw new Error("Non riesco a collegarmi alla rete dei volontari.")
}
function reteInfo(){return LS.get("natan_rete",null)}
function peerId(info,slot){return "natan-"+info.id+"-"+slot}
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const ECDSA={name:"ECDSA",namedCurve:"P-256"},SHA={name:"ECDSA",hash:"SHA-256"};
async function volKeys(){
  let k=null;try{k=await DB.get("chiave_volontario")}catch(e){}
  if(!k){k=await crypto.subtle.generateKey(ECDSA,false,["sign","verify"]);try{await DB.set("chiave_volontario",k)}catch(e){}}
  return k
}
async function volPub(){const k=await volKeys();const j=await crypto.subtle.exportKey("jwk",k.publicKey);return {x:j.x,y:j.y}}
async function checkVolunteer(info,slot,m,nonce){
  // 1) il certificato è firmato dal server di Natan?  2) è per questo posto e non è scaduto?  3) la prova è firmata dal volontario?
  try{
    const kev=await crypto.subtle.importKey("jwk",{...info.chiave,ext:true},ECDSA,false,["verify"]);
    if(!await crypto.subtle.verify(SHA,kev,unb64u(m.firma),new TextEncoder().encode(m.cert)))return false;
    const c=JSON.parse(m.cert);if(c.s!==slot||c.scad*1000<Date.now()||(info.revocati||[]).includes(slot))return false;
    const vk=await crypto.subtle.importKey("jwk",{kty:"EC",crv:"P-256",x:c.k.x,y:c.k.y,ext:true},ECDSA,false,["verify"]);
    return await crypto.subtle.verify(SHA,vk,unb64u(m.prova),new TextEncoder().encode(nonce))
  }catch(e){return false}
}
// --- lato telefono: trovo un volontario e gli faccio la domanda
const CLI={peer:null,conn:null,slot:0,wait:{}};
async function clientPeer(){
  if(CLI.peer&&!CLI.peer.destroyed&&CLI.peer.open)return CLI.peer;
  const P=await peerLib();const p=new P();CLI.peer=p;
  await new Promise((ok,bad)=>{const t=setTimeout(()=>bad(new Error("rete")),9000);p.on("open",()=>{clearTimeout(t);ok()});p.on("error",e=>{if(!p.open){clearTimeout(t);bad(e)}})});
  return p
}
async function findVolunteer(){
  if(CLI.conn&&CLI.conn.open)return CLI.conn;
  await findBase(true);const info=reteInfo();if(!info||!info.posti||!info.chiave)throw new Error("nessun volontario");
  const p=await clientPeer();
  const slots=[...Array(info.posti).keys()].map(i=>i+1).filter(s=>!(info.revocati||[]).includes(s)).sort(()=>Math.random()-.5);
  return await new Promise((ok,bad)=>{
    let left=slots.length,done=false;if(!left)return bad(new Error("nessun volontario"));
    const fail=()=>{if(--left<=0&&!done)bad(new Error("nessun volontario"))};
    for(const slot of slots){
      let c;try{c=p.connect(peerId(info,slot),{reliable:true})}catch(e){fail();continue}
      const nonce=b64u(crypto.getRandomValues(new Uint8Array(18)));let answered=false;
      const t=setTimeout(()=>{if(!answered){answered=true;try{c.close()}catch(e){}fail()}},7000);
      c.on("open",()=>c.send({t:"ciao",nonce}));
      c.on("data",async m=>{
        if(m&&m.t==="cert"&&!answered){answered=true;clearTimeout(t);
          if(!done&&await checkVolunteer(info,slot,m,nonce)){done=true;CLI.conn=c;CLI.slot=slot;c.on("data",clientData);c.on("close",()=>{if(CLI.conn===c)CLI.conn=null});ok(c)}
          else{try{c.close()}catch(e){}fail()}}
      });
      c.on("error",()=>{if(!answered){answered=true;clearTimeout(t);fail()}});
    }
  })
}
function clientData(m){const w=m&&CLI.wait[m.id];if(!w)return;if(m.t==="pezzo")w.onText(m.testo);if(m.t==="fine"){delete CLI.wait[m.id];w.ok(m.testo)}if(m.t==="no"){delete CLI.wait[m.id];w.bad(new Error(m.motivo||"occupato"))}}
async function askNet(messages,think,onText){
  const c=await findVolunteer();const id=rid("d");
  return await new Promise((ok,bad)=>{
    let last=Date.now();const w={onText:t=>{last=Date.now();onText(t)},ok:t=>{clearInterval(iv);ok(t)},bad:e=>{clearInterval(iv);bad(e)}};CLI.wait[id]=w;
    const iv=setInterval(()=>{if(Date.now()-last>60000||!c.open){delete CLI.wait[id];clearInterval(iv);CLI.conn=null;bad(new Error("il volontario non risponde"))}},2000);
    c.send({t:"domanda",id,messages,think:!!think,max:900})
  })
}
// --- lato volontario: quando il Mac è spento rispondo io ai telefoni che si collegano
const NET={peer:null,conns:new Map(),active:0,queue:[],served:0,slot:0};
function netLog(t){HELP.log.unshift({t:Date.now(),x:t});HELP.log=HELP.log.slice(0,30);LS.set("natan_vol_log",HELP.log.slice(0,30));if(VIEW==="aiuta")renderHelpStatus()}
async function netHost(){
  const cert=LS.get("natan_cert",null);const info=reteInfo();
  if(!HELP.on||!cert||!info||NET.peer)return;
  try{if(JSON.parse(cert.cert).scad*1000<Date.now())return}catch(e){return}
  let P;try{P=await peerLib()}catch(e){netLog("Rete senza server non disponibile: "+e.message);return}
  const p=new P(peerId(info,cert.posto));NET.peer=p;NET.slot=cert.posto;
  p.on("open",()=>{netLog("Sei nella rete senza server (posto "+cert.posto+"): se il server di Natan si spegne, i telefoni arrivano a te");renderHelpStatus()});
  p.on("error",e=>{if(e&&e.type==="unavailable-id")netLog("Il tuo posto nella rete è già aperto in un'altra finestra");});
  p.on("disconnected",()=>{try{if(HELP.on)p.reconnect()}catch(e){}});
  p.on("connection",c=>{
    c.on("data",m=>hostData(c,m,cert));
    c.on("open",()=>{NET.conns.set(c.peer,Date.now());netLog("Un dispositivo si è collegato a te");renderHelpStatus()});
    c.on("close",()=>{NET.conns.delete(c.peer);renderHelpStatus()});
  });
}
function netStop(){try{NET.peer&&NET.peer.destroy()}catch(e){}NET.peer=null;NET.conns.clear();NET.queue=[]}
async function hostData(c,m,cert){
  if(!m||!HELP.on)return;
  if(m.t==="ciao"){const k=await volKeys();const prova=b64u(await crypto.subtle.sign(SHA,k.privateKey,new TextEncoder().encode(String(m.nonce||""))));c.send({t:"cert",cert:cert.cert,firma:cert.firma,prova});return}
  if(m.t==="domanda"){if(HELP.mac!=="spento"){HELP.mac="spento"}NET.queue.push({c,m});NET.conns.set(c.peer,Date.now());renderHelpStatus();if(NET.queue.length===1)hostWork()}
}
async function hostWork(){
  while(NET.queue.length&&HELP.on){
    const {c,m}=NET.queue[0];NET.active=1;HELP.job=true;renderHelpStatus();renderHelpBadge();const t0=Date.now();let last=0;
    try{
      const r=await gen(HELP.test.livello,trimMsgs(m.messages||[]),{maxTokens:Math.min(m.max||900,1200),think:!!m.think,
        onText:t=>{if(Date.now()-last>700){last=Date.now();try{c.send({t:"pezzo",id:m.id,testo:t})}catch(e){}}}});
      try{c.send({t:"fine",id:m.id,testo:r.text})}catch(e){}
      NET.served++;HELP.aiutati++;netLog("Hai risposto a un dispositivo senza il server ("+Math.round((Date.now()-t0)/1000)+" s)")
    }catch(e){try{c.send({t:"no",id:m.id,motivo:"errore"})}catch(er){}}
    NET.queue.shift();NET.active=0;HELP.job=false;renderHelpStatus();renderHelpBadge();
    await sleep((Date.now()-t0)/3)                       // lavoro al massimo 3/4 del tempo
  }
}

function checkCrash(){
  const c=LS.get("natan_carico",null);if(!c)return;try{localStorage.removeItem("natan_carico")}catch(e){}
  if(Date.now()-c.ts>20*60000||!(c.fine||c.gia))return;  // chiusa durante il primo scaricamento: riprendo, non è un problema di memoria
  const cr=LS.get("natan_crash",{});cr[c.id]=Date.now();LS.set("natan_crash",cr);
  const d=downloaded();delete d[c.lvl];LS.set("natan_scaricato",d);
  const recent=Object.values(cr).filter(t=>Date.now()-t<3600000).length;
  if(recent>=2||!LEVELS[c.lvl]||LEVELS[c.lvl].ids.every(id=>cr[id]||cr[id.replace("q4f16","q4f32")])){
    LS.set("natan_impegno","kevin");                    // basta tentativi: uso il server di Natan
    setTimeout(()=>toast("Natan sul dispositivo è troppo pesante per questo telefono: uso Altissimo (server di Natan)."),2400)
  }else setTimeout(()=>toast("L'ultima volta Natan "+(LEVELS[c.lvl]?.name||"")+" era troppo pesante e l'app si è chiusa: ora uso una versione più leggera."),2400)
}

function memGB(){const m=LS.get("natan_ram",0);return m||navigator.deviceMemory||(IS_IOS?0:IS_MOBILE?4:8)}
function kevinAllowed(){return !PC||PRO||!hasWebGPU()}
async function deviceAdvice(){
  const g=await gpuInfo();const mem=memGB();const out={};
  for(const k of ORDER){const L=LEVELS[k];
    if(!g.ok)out[k]={tag:"no",t:"non va qui"};
    else if(!mem)out[k]=k==="veloce"?{tag:"",t:"consigliato"}:k==="medio"?{tag:"warn",t:"iPhone 15 Pro o più recenti"}:{tag:"no",t:"troppo pesante"};
    else if(L.ram<=mem*0.75)out[k]={tag:"",t:"va bene"};
    else if(L.ram<=mem)out[k]={tag:"warn",t:"al limite"};
    else out[k]={tag:"no",t:"troppo pesante"}}
  const summary=!g.ok?"Questo browser non ha WebGPU: Natan non può girare sul dispositivo. Su iPhone serve iOS 26, su Android e PC Chrome o Edge aggiornati.":
    mem?"Memoria: circa "+mem+" GB"+(navigator.deviceMemory&&!LS.get("natan_ram",0)&&navigator.deviceMemory>=8?" o più":"")+". Il test del PC in «Aiuta Natan» controlla meglio processore e scheda video.":"Su iPhone parti da Basico: se va bene prova Medio.";
  return {g,mem,out,summary}
}
function defaultLevel(adv){if(!PC)return "kevin";if(!adv.g.ok)return "kevin";let best="";for(const k of ORDER)if(adv.out[k].tag==="")best=k;return best||"veloce"}

async function send(forced,opts={}){

        try{await askVolunteer(t,opts,show,t0,done,um)}
        catch(e2){if(!deviceLevel())throw Object.assign(new Error("spento"),{code:0});await askDevice(deviceLevel(),t,opts,show,t0,done,um)}}
    }else await askDevice(lvl,t,opts,show,t0,done,um)
  }catch(e){st.text=true;wait.classList.remove("wait");SPK.cancel();
    if(e.code===403&&e.data?.error==="nome_bannato"){toast("Ti chiediamo di cambiare nome");openPage("impostazioni")}
    else if(e.code===401)wait.textContent="Il tuo invito non vale più: chiedi un nuovo invito.";
    else if(e.code===0)wait.textContent=ph.length?"Le foto le legge solo il server di Natan, che adesso è spento. Riprova più tardi.":"Il server di Natan è spento e nessun volontario è collegato. Scegli Basico, Medio o Alto dal menu in alto per usare Natan sul tuo dispositivo.";
    else wait.textContent="Errore: "+e.message}

}

const SPK={voice:null,spoken:0,said:"",on:false,q:0,
  pick(){
    if(!("speechSynthesis" in window))return null;
    const all=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang));if(!all.length)return null;
    const want=LS.get("natan_voce","");if(want){const w=all.find(v=>v.name===want);if(w)return w}
    const score=v=>(/neural|natural|online|premium|enhanced|siri/i.test(v.name)?10:0)+(/google/i.test(v.name)?6:0)+(/alice|federica|emma|isabella|elsa|diego|luca|giorgio|paola/i.test(v.name)?3:0)+(v.localService?0:1);
    return all.sort((a,b)=>score(b)-score(a))[0]},
  voices(){return "speechSynthesis" in window?speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang)):[]},
  active(){return CALL.on||$("tVoice").classList.contains("on")},
  begin(){this.spoken=0;this.said="";this.on=this.active();if(this.on)this.cancel(true)},
  feed(text,final){
    if(!this.on||!("speechSynthesis" in window))return;
    const clean=String(text).replace(/[🧠📷⏳✓✗•]/g,"");
    if(/^(Sto pensando|Ci penso|Cerco|Preparo|Risponde un volontario|Il server di Natan è spento: cerco)/.test(clean)||!/[a-zà-ù0-9]/i.test(clean))return;
    if(this.said&&!clean.startsWith(this.said)){this.spoken=0;this.said=""}       // il testo è cambiato (era un messaggio d'attesa)
    let upto=-1;const rest=clean.slice(this.spoken);
    if(final)upto=clean.length;else{const m=[...rest.matchAll(/[.!?…:;\n](\s|$)/g)];if(m.length){const last=m[m.length-1];upto=this.spoken+last.index+1}}
    if(upto>this.spoken){const part=clean.slice(this.spoken,upto).trim();this.spoken=upto;this.said=clean.slice(0,upto);if(part)this.utter(part)}
    if(final&&!this.q)CALL.spokeAll()
  },
  utter(t){
    try{const u=new SpeechSynthesisUtterance(t.slice(0,600));u.lang="it-IT";const v=this.voice||(this.voice=this.pick());try{if(v)u.voice=v}catch(e){}u.rate=1.04;u.pitch=1;
      this.q++;u.onstart=()=>CALL.setPhase("parla");u.onboundary=()=>CALL.bump();u.onend=u.onerror=()=>{this.q=Math.max(0,this.q-1);if(!this.q)CALL.spokeAll()};
      speechSynthesis.speak(u)}catch(e){this.q=Math.max(0,this.q-1)}},       // la voce non deve mai bloccare la risposta
  say(t){this.on=true;this.spoken=0;this.said="";this.cancel(true);this.feed(t,true)},
  cancel(keep){try{speechSynthesis.cancel()}catch(e){}this.q=0;if(!keep)this.on=false}
};

const STUDY={on:false,topic:"",materia:"",cur:"",pages:0,notes:0,sent:0,msg:"",p0:0,n0:0,titles:[],seen:new Set(LS.get("natan_studiati",[]))};
const SKIP=/^(note|bibliografia|collegamenti esterni|voci correlate|altri progetti|fonti|riferimenti|filmografia|discografia)$/i;
function chunks(text){
  const out=[];let cur="";
  for(let p of text.split(/\n+/)){p=p.trim();if(!p)continue;
    const h=p.match(/^=+\s*(.*?)\s*=+$/);if(h){if(SKIP.test(h[1]))break;continue}
    if(cur.length+p.length>800&&cur.length>200){out.push(cur);cur=""}
    cur+=(cur?"\n":"")+p}
  if(cur.length>=120)out.push(cur);
  return out.filter(c=>c.length>=120).map(c=>c.slice(0,1400))
}
async function studyLoop(){

  try{
    while(STUDY.on){
      if(!pool.length){
        const ints=prof?.interests||["Storia"];const mat=auto?ints[Math.floor(Math.random()*ints.length)]:STUDY.materia;if(auto)STUDY.materia=mat;
        const s=await wiki({action:"query",list:"search",srlimit:10,srsearch:auto?mat:STUDY.topic,sroffset:auto?Math.floor(Math.random()*200):offset});
        offset+=10;pool=((s.query&&s.query.search)||[]).map(x=>x.title).filter(x=>!STUDY.seen.has(x));
        if(!pool.length){if(!auto){STUDY.msg="Ho finito: non trovo altre pagine nuove su «"+STUDY.topic+"».";break}await sleep(1500);continue}
      }

      const page=Object.values((e.query&&e.query.pages)||{})[0]||{};const cs=chunks(page.extract||"").slice(0,25);

        const rows=(await DB.get("m:"+MINE))||[];const base=Date.now();
        cs.forEach((c,i)=>rows.push([base+i,"it",page.title||title,c]));await DB.set("m:"+MINE,rows);
        const meta=libMeta();meta[MINE]={n:rows.length,max:base,kb:0};setLibMeta(meta);
        const qd=LS.get("natan_appunti_coda",[]);cs.forEach(c=>qd.push({materia:STUDY.materia||"Generale",title:page.title||title,url,text:c}));LS.set("natan_appunti_coda",qd.slice(-3000));

    }

  STUDY.on=false;STUDY.cur="";

  renderImpTop();updateStatus()
}

async function hwInfo(){
  const g=await gpuInfo();const cores=navigator.hardwareConcurrency||4;const ram=memGB()||8;
  const v=g.vendor||"";const name=v.includes("nvidia")?"NVIDIA":v.includes("amd")||v.includes("ati")?"AMD":v.includes("apple")?"Apple":v.includes("intel")?"Intel":v.includes("qualcomm")?"Qualcomm":v.includes("arm")?"ARM":v?v:"";
  const strong=name==="NVIDIA"||name==="AMD"||name==="Apple";
  const gpuTxt=!g.ok?"non adatta (manca WebGPU)":(name||"sconosciuta")+(g.arch?" ("+g.arch+")":"")+(g.desc?" · "+g.desc:"")+(g.maxBuf?" · fino a "+(g.maxBuf/1073741824).toFixed(1).replace(".",",")+" GB per blocco":"");
  // ragionamento: la RAM decide quanto è grande il modello (3/4 della RAM), la scheda video e il processore se va veloce
  const budget=ram*0.75;const why=[];let lvl="";
  for(const k of ORDER)if(LEVELS[k].ram<=budget)lvl=k;
  why.push("RAM "+ram+" GB: posso usare fino a "+String(Math.round(budget*10)/10).replace(".",",")+" GB (3/4)"+(lvl?", basta per "+LEVELS[lvl].name:", troppo poca"));
  if(g.ok&&!strong&&lvl==="massimo"){lvl="medio";why.push("Scheda video integrata: meglio "+LEVELS.medio.name+", il più grande andrebbe lento")}
  if(g.ok&&g.maxBuf&&g.maxBuf<1.2e9&&lvl&&lvl!=="veloce"){lvl="veloce";why.push("La scheda video accetta blocchi piccoli: uso "+LEVELS.veloce.name)}
  else if(g.ok&&g.maxBuf&&g.maxBuf<2.2e9&&lvl==="massimo"){lvl="medio";why.push("La scheda video accetta blocchi medi: uso "+LEVELS.medio.name)}
  if(cores<4&&lvl&&lvl!=="veloce"){lvl="veloce";why.push("Solo "+cores+" core: uso il modello più leggero")}
  if(strong&&g.ok)why.push("Scheda video "+name+": ottima per Natan");
  if(!g.ok){lvl="";why.unshift("Questo browser non può usare la scheda video: serve Chrome o Edge aggiornati")}

}

function openHelp(pg){
  pg.append(el("h1","","Aiuta Natan e ti daremo un Natan potente 🤵‍♂️"),el("p","lead","Il tuo computer risponde alle domande dei compagni quando il server di Natan è occupato o spento. Vedi quante persone aiuti, mai chi sono."));
  if(IS_MOBILE){const p=el("div","panel");p.append(el("h2","","Si aiuta dal computer"),el("span","","Così non consumi la batteria del telefono. Apri questo sito dal tuo PC o Mac con Chrome o Edge."));pg.append(p);return}
  const t=el("div","panel");t.id="helpTest";pg.append(t);const s=el("div","panel");s.id="helpStatus";pg.append(s);const l=el("div","panel");l.id="helpLog";pg.append(l);
  const rules=el("div","panel");rules.append(el("h2","","Le regole"));
  ["Uso al massimo 3/4 della memoria del computer e lavoro al massimo 3/4 del tempo.","Funziono solo mentre questa pagina è aperta: chiudila e mi fermo subito.","Natan fa controlli di qualità a sorpresa: all'inizio e poi ogni 3 giorni.","Premio: chi viene approvato ha Natan Pro, cioè Altissimo (14 miliardi di parametri) con ragionamento lungo e «Pensaci meglio»."].forEach(x=>rules.append(el("span","small",x)));
  pg.append(rules);renderHelpTest();renderHelpStatus()
}
async function renderHelpTest(){
  const p=$("helpTest");if(!p||VIEW!=="aiuta")return;
  const hw=HELP.hw||(HELP.hw=await hwInfo());if(!$("helpTest"))return;
  p.innerHTML="";p.append(el("h2","","Il tuo computer"));
  const g=el("div","hw");
  const row=(k,v)=>{const d=el("div");d.append(el("b","",k),el("span","",v));g.append(d)};
  row("Processore",hw.cores+" core");row("Scheda video",hw.gpuTxt);
  const rr=el("div");rr.append(el("b","","RAM"));const sel=el("select","field");sel.id="ramSel";sel.style.cssText="width:auto;min-height:36px;padding:4px 10px";
  [4,8,12,16,24,32,64].forEach(n=>{const o=el("option","",n+" GB");o.value=n;sel.append(o)});sel.value=String(hw.ram);sel.setAttribute("aria-label","Quanta RAM ha il tuo computer");
  sel.onchange=()=>{LS.set("natan_ram",Number(sel.value));HELP.hw=null;renderHelpTest()};rr.append(sel);
  if(hw.ramBrowser&&hw.ramBrowser>=8&&!LS.get("natan_ram",0))rr.append(el("span","small","il browser vede al massimo 8 GB: se ne hai di più, sceglilo qui"));
  g.append(rr);p.append(g);
  const why=el("div","list");(HELP.test&&!HELP.testing?HELP.test.why||hw.why:hw.why).forEach(x=>why.append(el("span","small","• "+x)));p.append(why);
  if(hw.lvl&&!HELP.test)p.append(el("span","","Livello che proverò: "+LEVELS[hw.lvl].name+" ("+LEVELS[hw.lvl].params+")"));
  if(HELP.test&&!HELP.testing){const r=el("span","pill "+(HELP.test.ok?"ok":"no"),(HELP.test.ok?"Test superato: ":"Troppo lento: ")+num(HELP.test.parole)+" parole al secondo con "+(LEVELS[HELP.test.livello]?.name||""));r.style.alignSelf="flex-start";p.append(r)}
  if(HELP.testing&&ENG.prog){const pc=Math.round(ENG.prog.p*100);const bar=el("div","bar");const i=el("i");i.style.width=pc+"%";bar.append(i);p.append(el("span","small","Scarico il modello: "+pc+"%"),bar)}
  if(HELP.msg&&(HELP.testing||!HELP.on))p.append(el("span","small",HELP.msg));
  const b=el("button","btn ghost",HELP.testing?"Test in corso…":HELP.test?"Rifai il test":"Fai il test del PC");b.id="testBtn";b.disabled=HELP.testing||HELP.on;b.onclick=pcTest;b.style.alignSelf="flex-start";p.append(b)
}
function renderHelpStatus(){
  renderHelpBadge();updateStatus();
  const p=$("helpStatus");if(!p||VIEW!=="aiuta")return;p.innerHTML="";
  const head=el("div","row");head.append(el("h2","","Aiuta Natan"));const sp=el("span","");sp.style.flex="1";head.append(sp);
  const sw=el("button","sw"+(HELP.on?" on":""));sw.id="helpSwitch";sw.setAttribute("role","switch");sw.setAttribute("aria-checked",String(HELP.on));sw.setAttribute("aria-label","Aiuta Natan");
  sw.onclick=()=>HELP.on?helpOff():helpOn();sw.disabled=HELP.testing;head.append(sw);p.append(head);
  const st={in_prova:["wait","In prova: Natan sta facendo i controlli di qualità"],approvato:["ok","Approvato: hai Natan Pro"],sospeso:["no","Sospeso: i controlli non sono andati bene, parlane con chi gestisce Natan"]}[HELP.stato];
  if(st){const pl=el("span","pill "+st[0],st[1]);pl.style.alignSelf="flex-start";p.append(pl)}
  if(!HELP.on){p.append(el("span","small",HELP.test?.ok?"Accendi l'interruttore per iniziare.":"Prima fai il test del PC qui sopra."));if(HELP.msg)p.append(el("span","err",HELP.msg))}
  else{
    const mode=HELP.mac==="spento"?(NET.peer?"Il server di Natan è spento: i dispositivi si collegano direttamente a te (posto "+NET.slot+").":"Il server di Natan è spento"+(HELP.stato==="approvato"?": sto entrando nella rete senza server…":": serve essere approvati per aiutare senza il server."))
      :HELP.mac==="occupato"?"Il server di Natan è occupato: le domande arrivano a te."
      :HELP.sempre?"Il server di Natan è acceso: ti passa le domande di telefoni e PC quando sei libero.":"Il server di Natan è libero e risponde da solo: ti passo le domande appena è occupato o si spegne.";
    p.append(el("span","",mode));
    const g=el("div","grid4");
    const stat=(n,l)=>{const d=el("div","stat");d.append(el("b","",num(n)),el("span","",l));g.append(d)};
    stat(HELP.aiuti+NET.conns.size,"persone che aiuti adesso");stat(HELP.job?1:0,"domande in lavorazione");stat((HELP.rete.in_attesa||0)+Math.max(0,NET.queue.length-1),"domande in coda");
    stat(HELP.aiutati,"risposte date in tutto");stat(HELP.rete.utenti_online,"persone online su Natan");stat(HELP.rete.volontari_online,"volontari online");
    p.append(g);if(HELP.msg)p.append(el("span","err",HELP.msg))}
  const l=$("helpLog");if(l){l.innerHTML="";l.append(el("h2","","Cosa è successo"));const lg=el("div","log");
    if(!HELP.log.length)lg.append(el("span","small","Ancora niente."));
    HELP.log.slice(0,12).forEach(x=>{const d=el("div","");d.append(el("time","",hhmm(x.t)),document.createTextNode(x.x));lg.append(d)});l.append(lg)}
}

// --- Impostazioni
function openSettings(pg){
  pg.append(el("h1","","Impostazioni"));
  const p1=el("div","panel");p1.append(el("h2","","Profilo"));profileForm(p1,true,()=>{renderSide();openPage("impostazioni")});pg.append(p1);
  const p2=el("div","panel");p2.append(el("h2","","Voce"),el("span","small","La voce con cui Natan legge le risposte e parla nella chiamata. Le voci con «Natural», «Neural» o «Siri» nel nome sono le più umane."));
  const vs=SPK.voices();const sel=el("select","field");const o0=el("option","","Scegli Natan da solo (la più naturale)");o0.value="";sel.append(o0);
  vs.forEach(v=>{const o=el("option","",v.name+(v.localService?"":" (online)"));o.value=v.name;sel.append(o)});sel.value=LS.get("natan_voce","");
  sel.onchange=()=>{LS.set("natan_voce",sel.value);SPK.voice=null;SPK.say("Ciao, io sono Natan. Questa è la mia voce.")};
  const tr=el("button","btn ghost","Prova la voce");tr.style.alignSelf="flex-start";tr.onclick=()=>SPK.say("Ciao, io sono Natan. Questa è la mia voce.");
  p2.append(vs.length?sel:el("span","small","Questo dispositivo non ha voci italiane: installane una dalle impostazioni del sistema."),tr);pg.append(p2);
  const meta=libMeta();const n=Object.values(meta).reduce((a,m)=>a+(m.n||0),0);
  const p3=el("div","panel");p3.append(el("h2","","Dati"),el("span","",chats.length+" chat salvate qui, "+num(n)+" appunti nella biblioteca. In attesa di arrivare al server: "+LS.get("natan_coda",[]).length+" messaggi e "+LS.get("natan_appunti_coda",[]).length+" appunti."),el("span","small","Tutto quello che scrivi arriva a chi gestisce Natan, che può leggerlo per migliorarlo."));
  const lb=el("button","btn ghost","Gestisci la biblioteca");lb.style.alignSelf="flex-start";lb.onclick=()=>openPage("biblioteca");p3.append(lb);pg.append(p3);
  const p4=el("div","panel");p4.append(el("h2","","App"),el("span","","Natan "+VERSION+(PC?" per computer":" per telefono")));
  const r=el("div","row");const ins=el("button","btn ghost","Installa Natan come app");ins.onclick=install;const info=el("button","btn ghost","Chi è Natan");info.onclick=()=>location.href="../";r.append(ins,info);p4.append(r);pg.append(p4)
}
let deferred=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});
function install(){if(deferred){deferred.prompt();deferred=null;return}
  if(IS_IOS)toast("Tocca Condividi in basso, poi «Aggiungi alla schermata Home»");
  else if(PC)toast("In Chrome o Edge premi l'icona di installazione nella barra degli indirizzi");
  else toast("Apri il menu ⋮ del browser e scegli «Installa app»")}
if("Notification" in window&&Notification.permission==="default")document.addEventListener("click",()=>Notification.requestPermission().catch(()=>{}),{once:true});
start();
